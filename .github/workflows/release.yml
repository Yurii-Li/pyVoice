name: Build and Release PyVoiceAI

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Download Whisper engine & model
      run: |
        python -c "from pyvoice.core.tts import align_and_split_with_whisper; print('Binaries checked')"

    - name: Build Single Executable with PyInstaller
      run: |
        pyinstaller PyVoiceAI.spec

    - name: Create GitHub Release and Upload EXE
      uses: softprops/action-gh-release@v2
      with:
        files: dist/PyVoiceAI.exe
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
