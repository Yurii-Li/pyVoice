name: Build and Release PyVoiceAI

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Ensure bin directory and tools
      run: |
        mkdir -p bin
        # Завантажуємо standalone ffmpeg якщо відсутній для бандлінгу
        curl -L -o ffmpeg.zip "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip"
        tar -xf ffmpeg.zip
        cp ffmpeg-master-latest-win64-gpl/bin/ffmpeg.exe bin/
        cp ffmpeg-master-latest-win64-gpl/bin/ffprobe.exe bin/

    - name: Build Single Executable with PyInstaller
      run: |
        pyinstaller PyVoiceAI.spec

    - name: Install Inno Setup
      run: |
        choco install innosetup -y --no-progress

    - name: Compile Inno Setup Installer
      run: |
        & "C:\Program Files (x86)\Inno Setup 6\iscc.exe" installer.iss

    - name: Create GitHub Release and Upload Binaries
      uses: softprops/action-gh-release@v2
      with:
        files: |
          dist/PyVoiceAI-Setup.exe
          dist/PyVoiceAI.exe
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
